<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABIA - SPA</title>
    <link href="https://fonts.googleapis.com/css2?family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">

    <!-- Aplica o tema salvo (ou a preferência do sistema) antes de pintar a página -->
    <script>
        try {
            var t = localStorage.getItem('tema_abia');
            if (t !== 'dark' && t !== 'light') {
                t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* storage indisponível: mantém o tema claro */ }
    </script>
    
    <!-- Biblioteca externa -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Script principal modular -->
    <script type="module" src="../js/main.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#app">Ir para o conteúdo principal</a>
    <header>
        <div class="logo-area">
            <img src="../imagem/logoabia1-180.png" srcset="../imagem/logoabia1-360.png 2x" alt="Logo da ABIA" class="logo-img" width="180" height="180" fetchpriority="high" decoding="async">
            <span class="logo">Associação Brasileira pela Inclusão Autista</span>
        </div>
        <div class="secao-interativa">
            <nav aria-label="Navegação principal">
                <ul>
                    <!-- Uso de Hash Routing para evitar erros 404 em servidores estáticos -->
                    <li><a href="#/" class="nav-link">Início</a></li>
                    <li><a href="#/projetos" class="nav-link">Projetos</a></li>
                    <li><a href="#/cadastro" class="nav-link">Cadastre-se</a></li>
                </ul>
            </nav>
        </div>
        <button type="button" id="btn-tema" class="btn-tema" aria-pressed="false">
            <span aria-hidden="true">🌙</span> Modo escuro
        </button>
    </header>

    <!-- Contentor onde o JavaScript injeta o conteúdo -->
    <main id="app" class="grid-12"></main>

    <footer>
        <p>&copy; 2026 ABIA. Todos os direitos reservados.</p>
        <p><a href="mailto:contato@abia.org">contato@abia.org</a></p>
    </footer>
</body>
</html>
